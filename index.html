<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFP Gallery</title>
<style>
  :root {
    --bg: #14131a;
    --surface: #1d1c26;
    --text: #ece9f4;
    --muted: #9a96ad;
    --accent: #8f7cff;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { margin: 0 0 4px; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.02em; }
  #count { margin: 0; color: var(--muted); }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .thumb {
    padding: 0;
    border: 0;
    border-radius: var(--radius);
    background: var(--surface);
    aspect-ratio: 1 / 1;
    overflow: hidden;
    cursor: zoom-in;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .thumb:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #status { text-align: center; color: var(--muted); padding: 64px 16px; }
  #status.error { color: #ff9b9b; }
  #status small { display: block; margin-top: 8px; color: var(--muted); }
  #status code { background: var(--surface); padding: 2px 6px; border-radius: 6px; }

  dialog {
    width: 100vw; height: 100vh; max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0;
    background: rgba(8, 7, 12, .92);
    color: var(--text);
  }
  dialog::backdrop { background: transparent; }
  .viewer { height: 100%; display: grid; place-items: center; padding: 56px 16px; }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: var(--radius); object-fit: contain; }
  .viewer-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 16px; font-size: .9rem; color: var(--muted);
  }
  .viewer-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-bar a, .viewer-bar button, .nav {
    color: var(--text); background: var(--surface); border: 0; border-radius: 999px;
    padding: 8px 14px; font: inherit; text-decoration: none; cursor: pointer;
  }
  .viewer-bar a:focus-visible, .viewer-bar button:focus-visible, .nav:focus-visible { outline: 3px solid var(--accent); }
  .viewer-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0; font-size: 1.4rem; }
  .nav.prev { left: 12px; }
  .nav.next { right: 12px; }
  @media (max-width: 520px) { .nav { top: auto; bottom: 16px; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PFP Gallery</h1>
    <p id="count" aria-live="polite"></p>
  </header>
  <main>
    <div id="status" role="status">Loading images…</div>
    <div id="grid" hidden></div>
  </main>
</div>

<dialog id="viewer" aria-label="Image preview">
  <div class="viewer-bar">
    <span id="viewer-name"></span>
    <div class="viewer-actions">
      <a id="viewer-open" href="#" target="_blank" rel="noopener">Open original</a>
      <button id="viewer-close" type="button">Close</button>
    </div>
  </div>
  <button class="nav prev" type="button" aria-label="Previous image">‹</button>
  <div class="viewer"><img id="viewer-img" alt=""></div>
  <button class="nav next" type="button" aria-label="Next image">›</button>
</dialog>

<script>
(() => {
  // ---- Configuration -------------------------------------------------
  // On GitHub Pages the owner and repo are detected from the URL
  // (https://OWNER.github.io/REPO/). The fallbacks below are used
  // when you open the file locally or host it on a custom domain.
  const FALLBACK_OWNER = "pranitdhanade-sys";
  const FALLBACK_REPO  = "pfp";
  const FOLDER         = "pfps";
  const CACHE_MINUTES  = 5;
  const EXTENSIONS     = /\.(jpe?g|png|gif|webp|avif|svg)$/i;
  // --------------------------------------------------------------------

  const host = location.hostname;
  const firstPath = location.pathname.split("/").filter(Boolean)[0];
  let owner = FALLBACK_OWNER, repo = FALLBACK_REPO;
  if (host.endsWith(".github.io")) {
    owner = host.split(".")[0];
    // Project site: /REPO/. User site (owner.github.io): files live at the root.
    repo = firstPath && !firstPath.includes(".") ? firstPath : host;
  }

  const $ = id => document.getElementById(id);
  const grid = $("grid"), statusEl = $("status"), countEl = $("count");
  const viewer = $("viewer"), viewerImg = $("viewer-img");
  let images = [];
  let current = 0;

  const api = `https://api.github.com/repos/${owner}/${repo}`;
  const headers = { Accept: "application/vnd.github+json" };

  function showError(message, hint) {
    grid.hidden = true;
    statusEl.hidden = false;
    statusEl.className = "error";
    statusEl.innerHTML = "";
    statusEl.append(message);
    if (hint) {
      const small = document.createElement("small");
      small.textContent = hint;
      statusEl.append(small);
    }
  }

  async function githubJson(url) {
    const res = await fetch(url, { headers });
    if (res.ok) return res.json();
    if (res.status === 403 || res.status === 429) {
      const reset = res.headers.get("x-ratelimit-reset");
      const when = reset ? new Date(reset * 1000).toLocaleTimeString() : "a little while";
      throw new Error(`GitHub’s API rate limit was reached. Try again after ${when}.`);
    }
    if (res.status === 404) {
      throw new Error(`Couldn’t find a “${FOLDER}” folder in ${owner}/${repo}. Check that the repository is public and the folder exists on the default branch.`);
    }
    throw new Error(`GitHub returned an error (${res.status}).`);
  }

  async function listImages() {
    const cacheKey = `pfp-cache:${owner}/${repo}`;
    try {
      const cached = JSON.parse(sessionStorage.getItem(cacheKey));
      if (cached && Date.now() - cached.time < CACHE_MINUTES * 60000) return cached.names;
    } catch (_) {}

    let names;
    const items = await githubJson(`${api}/contents/${FOLDER}`);
    if (!Array.isArray(items)) throw new Error(`“${FOLDER}” is not a folder.`);

    if (items.length >= 1000) {
      // The Contents API caps a folder at 1,000 entries and has no pagination,
      // so for very large folders read the full file tree instead.
      const tree = await githubJson(`${api}/git/trees/HEAD?recursive=1`);
      const prefix = FOLDER + "/";
      names = tree.tree
        .filter(n => n.type === "blob" && n.path.startsWith(prefix))
        .map(n => n.path.slice(prefix.length));
    } else {
      names = items.filter(i => i.type === "file").map(i => i.name);
    }

    names = names
      .filter(n => EXTENSIONS.test(n))
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));

    try { sessionStorage.setItem(cacheKey, JSON.stringify({ time: Date.now(), names })); } catch (_) {}
    return names;
  }

  // Relative URL: works on any Pages project URL and custom domain.
  const urlFor = name => `${FOLDER}/${name.split("/").map(encodeURIComponent).join("/")}`;

  function render() {
    const frag = document.createDocumentFragment();
    images.forEach((name, i) => {
      const btn = document.createElement("button");
      btn.className = "thumb";
      btn.type = "button";
      btn.setAttribute("aria-label", `Preview ${name}`);
      const img = document.createElement("img");
      img.src = urlFor(name);
      img.alt = name;
      img.loading = "lazy";
      img.decoding = "async";
      btn.append(img);
      btn.addEventListener("click", () => openViewer(i));
      frag.append(btn);
    });
    grid.replaceChildren(frag);
    grid.hidden = false;
    statusEl.hidden = true;
    countEl.textContent = `${images.length} image${images.length === 1 ? "" : "s"}`;
  }

  function openViewer(i) {
    current = (i + images.length) % images.length;
    const name = images[current], src = urlFor(name);
    viewerImg.src = src;
    viewerImg.alt = name;
    $("viewer-name").textContent = name;
    $("viewer-open").href = src;
    if (!viewer.open) viewer.showModal();
  }

  $("viewer-close").addEventListener("click", () => viewer.close());
  viewer.querySelector(".prev").addEventListener("click", () => openViewer(current - 1));
  viewer.querySelector(".next").addEventListener("click", () => openViewer(current + 1));
  // Click on the dark backdrop (not the image) closes the preview.
  viewer.addEventListener("click", e => {
    if (e.target === viewer || e.target.classList.contains("viewer")) viewer.close();
  });
  viewer.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") openViewer(current - 1);
    if (e.key === "ArrowRight") openViewer(current + 1);
  });
  viewer.addEventListener("close", () => { viewerImg.removeAttribute("src"); });

  listImages()
    .then(names => {
      images = names;
      if (!images.length) {
        statusEl.className = "";
        statusEl.textContent = `No images yet. Add .jpg, .png, .webp, .gif, .avif or .svg files to the “${FOLDER}” folder.`;
        return;
      }
      render();
    })
    .catch(err => {
      showError(
        err.message || "Something went wrong while loading the images.",
        err instanceof TypeError ? "Check your internet connection and reload the page." : "Reload the page to try again."
      );
    });
})();
</script>
</body>
</html>
